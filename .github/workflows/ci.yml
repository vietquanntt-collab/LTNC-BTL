name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build and run tests
      run: |
        if [ -f "./mvnw" ]; then
          chmod +x ./mvnw
          ./mvnw clean test
        elif [ -f "pom.xml" ]; then
          mvn clean test
        else
          echo "Chưa có pom.xml, hoàn tất kiểm tra cấu trúc tuần 1."
        fi